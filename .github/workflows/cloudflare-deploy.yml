name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: nadda-daily-cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Confirm the uploadable module matches source
        working-directory: cloudflare
        run: cmp src/worker.js dist/worker.js

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci

      - name: Write the D1 database id
        working-directory: cloudflare
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          case "$CLOUDFLARE_D1_DATABASE_ID" in
            ????????-????-????-????-????????????) ;;
            *) echo "CLOUDFLARE_D1_DATABASE_ID must be the D1 database UUID" >&2; exit 1 ;;
          esac
          sed -i "s/00000000-0000-0000-0000-000000000000/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.toml

      - name: Apply D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nadda-daily --remote

      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Ingest issues
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: bash cloudflare/sync.sh
